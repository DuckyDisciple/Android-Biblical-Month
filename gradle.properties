# More heap reduces GC churn that can make the whole machine (and Studio) feel frozen during AGP/Kotlin/KSP work.
# If 4g is too much on an 8GB Mac, try -Xmx3072m and optionally uncomment org.gradle.workers.max below.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin/KSP compile in a separate daemon; give it room so it does not fight the Gradle JVM.
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# On some macOS setups, Gradle's file watcher adds CPU load while Studio is open. Disable if sync feels sticky.
# org.gradle.vfs.watch=false
# Cap parallel workers if the IDE still freezes (uncomment and tune 2–4).
# org.gradle.workers.max=3

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home